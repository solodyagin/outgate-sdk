name: Protocol foundation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sdk:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/fixtures/protocol/v1/verify.py
      - run: python -B -m unittest discover -s tests -p "test_check_local_paths.py"
      - run: python -B tests/check_local_paths.py
      - run: go mod verify
        env:
          GOWORK: 'off'
      - run: python -B tests/verify_sbom.py
      - run: go test ./...
        env:
          GOWORK: 'off'
      - run: go vet ./...
        env:
          GOWORK: 'off'
      - if: runner.os == 'Linux'
        run: go test -race ./...
        env:
          GOWORK: 'off'
